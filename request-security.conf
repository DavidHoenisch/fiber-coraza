# Request-processing baseline for Coraza >= 3.8.1, used before application/CRS rules.
# Do not load this alongside coraza.conf-recommended: they use the same rule IDs.
# Override the limits later in your configuration if legitimate traffic needs it.
SecRequestBodyAccess On
SecRequestBodyJsonDepthLimit 1024
SecArgumentsLimit 1000

SecRule REQUEST_HEADERS:Content-Type "^application/json" \
    "id:200001,phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=JSON"
SecRule REQUEST_HEADERS:Content-Type "^application/[a-z0-9.-]+[+]json" \
    "id:200006,phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=JSON"

SecRule URI_PARSE_ERROR "@eq 1" \
    "id:200009,phase:1,t:none,log,deny,status:400,msg:'URI failed to parse'"
SecRule ARGUMENTS_LIMIT_REACHED "@eq 1" \
    "id:200004,phase:1,t:none,log,deny,status:400,msg:'Query or path argument limit reached'"
SecRule ARGUMENTS_LIMIT_REACHED "@eq 1" \
    "id:200005,phase:2,t:none,log,deny,status:400,msg:'Request body argument limit reached'"
SecRule REQBODY_ERROR "!@eq 0" \
    "id:200002,phase:2,t:none,log,deny,status:400,msg:'Failed to parse request body'"
